<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios con arreglos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js/java.js"></script>
</head>
<body class="bg-light">

    <main class="container-fluid">
        <section class="row">
            <aside class="col-md-3 col-lg-2 bg-dark text-white p-4">
                <h3>Ejercicios de arreglos</h3>

                <button class="btn btn-secondary w-100 mt-3" onclick="alumnos()">Ejercicio 1</button>
                <button class="btn btn-secondary w-100 mt-2" onclick="toroE()">Ejercicio 2</button>
            </aside>

            <section class="col-md-9 col-lg-10 p-4">

                <section class="card p-3 mb-4">
                    <div id="BI"></div>
                </section>

                <section class="card p-3" id="sueldos">
                    <h2>Ejercicio 3</h2>
                    <label for="puesto">Selecciona el puesto:</label>
                    <select id="puesto" class="form-select mb-3">
                        <option value="0">Diseñador</option>
                        <option value="1">Programador</option>
                        <option value="2">Lider</option>
                    </select>

                    <label for="nivel">Selecciona tu nivel tienes:</label>
                    <select id="nivel" class="form-select mb-3">
                        <option value="0">New</option>
                        <option value="1">Junior</option>
                        <option value="2">Senior</option>
                    </select>

                    <label for="horas">Cuantas horas trabajaste:</label>
                    <input type="number" id="horas" class="form-control mb-3" min="0">

                    <button class="btn btn-dark" onclick="salarios()">Calcular</button>
                    <h3 class="mt-3" id="total"></h3>
                </section>

            </section>
        </section>
    </main>

</body>
</html>
